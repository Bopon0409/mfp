<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MFP</title>
    <link rel="icon" type="image/png" href="/brand/mfp-mark.png" />
    <!-- Default look (until the user picks one in “View → Appearance”): new or classic. -->
    <meta name="mfp-ui-default" content="new" />
    <style>
      /* The Inter interface font is bundled (public/fonts, SIL OFL): works without internet. */

      @font-face { font-family: Inter; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/inter@latest/cyrillic-400-normal.ttf) format('truetype'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: Inter; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/inter@latest/latin-ext-400-normal.ttf) format('truetype'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: Inter; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/inter@latest/latin-500-normal.ttf) format('truetype'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: Inter; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/inter@latest/cyrillic-500-normal.ttf) format('truetype'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: Inter; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/inter@latest/latin-ext-500-normal.ttf) format('truetype'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: Inter; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/inter@latest/latin-600-normal.ttf) format('truetype'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: Inter; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/inter@latest/cyrillic-600-normal.ttf) format('truetype'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: Inter; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/inter@latest/latin-ext-600-normal.ttf) format('truetype'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      :root {
        --bg: #17191f;
        --panel: #22242a;
        --panel-2: #2b2e34;
        --panel-3: #33353b;
        --line: #2f3238;
        --border: #3d4046;
        --text: #eceef2;
        --text-2: #bbbec3;
        --muted: #9c9ea4;
        --accent: #4d7bfd;
        --accent-2: #3763ee;
        --accent-soft: #4d7bfd2e;
        --component: #ba82f5;
        --danger: #f45a56;
        --dev: #24c1c9;
        --warning: #ffb848;
        --menu: #1d1f25;
        font: 11px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-feature-settings: 'cv11';
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
      button, input, select { font: inherit; color: inherit; }
      .ic { width: 20px; height: 20px; display: block; flex: none; }

      #app { display: grid; grid-template-columns: calc(var(--rail-w, 66px) + var(--left-w, 240px)) 1fr var(--right-w, 248px); height: calc(100vh - var(--tabs-h, 0px)); margin-top: var(--tabs-h, 0px); }
      /* File tabs (desktop) */
      #filetabs { position: fixed; top: 0; left: 0; right: 0; height: var(--tabs-h); display: flex; align-items: stretch; gap: 2px; padding: 0 6px; background: #111; z-index: 80; overflow-x: auto; scrollbar-width: none; }
      #filetabs::-webkit-scrollbar { display: none; }
      .ftab-home, .ftab-plus { flex: none; width: 36px; border: none; background: none; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px 6px 0 0; margin-top: 4px; }
      .ftab-home:hover, .ftab-plus:hover { color: var(--text); background: #ffffff14; }
      .ftab-home.on { color: var(--text); background: var(--panel); }
      .ftab { flex: 0 1 200px; min-width: 96px; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; margin-top: 4px; border-radius: 6px 6px 0 0; color: var(--text-2); cursor: pointer; }
      .ftab:hover { background: #ffffff10; color: var(--text); }
      .ftab.on { background: var(--panel); color: var(--text); }
      .ftab-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ftab-close { width: 20px; height: 20px; padding: 0; border: none; border-radius: 4px; background: none; color: inherit; display: flex; align-items: center; justify-content: center; opacity: 0; cursor: pointer; flex: none; }
      .ftab:hover .ftab-close, .ftab.on .ftab-close, .ftab-close:focus-visible { opacity: 1; }
      .ftab-close:hover { background: #ffffff1f; }
      .ftab-close .ic, .ftab-home .ic, .ftab-plus .ic { width: 16px; height: 16px; }
      :root[data-contrast] #filetabs { background: #000; border-bottom: 1px solid #fff; }
      :root[data-contrast] .ftab.on, :root[data-contrast] .ftab-home.on { outline: 2px solid #fff; outline-offset: -2px; }
      aside { background: var(--panel); display: flex; flex-direction: column; min-height: 0; position: relative; }
      .resizer { position: absolute; top: 0; bottom: 0; width: 7px; z-index: 8; cursor: col-resize; }
      .resizer:hover, .resizer.drag { background: linear-gradient(90deg, transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px); }
      #left .resizer { right: -4px; }
      #right .resizer { left: -4px; }
      body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
      #stage.narrow .help-btn { bottom: 64px; }
      #stage.narrow #status { display: none; }
      #left { border-right: 1px solid #111; }
      #right { border-left: 1px solid #111; min-width: 0; container-type: inline-size; container-name: properties-panel; }

      /* Files (file list) */
      .home { position: fixed; inset: 0; top: var(--tabs-h, 0px); z-index: 70; display: grid; grid-template-columns: 240px 1fr; background: var(--bg); color: var(--text); }
      .home[hidden] { display: none; }
      .home-side { background: var(--panel); border-right: 1px solid #111; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
      .home-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 6px 10px 14px; }
      /* File list: the account and notifications on top, search below them. */
      .home-top { display: flex; align-items: center; gap: 4px; padding: 2px 0 8px; }
      .home-top .acct-btn { flex: 1; margin-top: 0 !important; }
      .home-top .acct-chev { display: flex; color: var(--muted); margin-left: auto; }
      .home-top .acct-chev .ic { width: 14px; height: 14px; }
      .home-search-wrap { padding: 0 0 8px; }
      .home-search-wrap .home-search { width: 100%; }
      .home-ic { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--text-2); }
      .home-ic .ic { width: 16px; height: 16px; }
      .home-nav { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 10px; border: none; border-radius: 6px; background: none; color: var(--text-2); cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
      .home-nav:hover { background: var(--panel-2); color: var(--text); }
      .home-nav.on { background: var(--accent-soft); color: var(--text); }
      .home-nav.drop, .home-card.drop { outline: 2px solid var(--accent); outline-offset: -2px; }
      .home-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .home-head { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .home-title { font-size: 16px; font-weight: 600; margin: 0; flex: 1; min-width: 160px; display: flex; align-items: center; flex-wrap: wrap; }
      .home-crumb { border: none; background: none; cursor: pointer; padding: 2px 4px; border-radius: 4px; font-weight: 600; }
      .home-crumb:hover { background: var(--panel-2); }
      .home-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .home-search, .home-sort, .home-rename { height: 30px; background: var(--panel-2); border: 1px solid transparent; border-radius: 6px; padding: 0 10px; outline: none; color: var(--text); }
      .home-search { width: 220px; }
      .home-search:focus, .home-rename:focus { border-color: var(--accent); }
      .home-rename { width: 100%; height: 24px; padding: 0 6px; }
      .home-btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: none; cursor: pointer; white-space: nowrap; }
      .home-btn:hover { background: var(--panel-2); }
      .home-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      .home-btn.primary:hover { background: var(--accent-2); }
      .home-grid { flex: 1; overflow: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; align-content: start; }
      .home-card { display: flex; flex-direction: column; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; overflow: hidden; outline: none; min-width: 0; }
      .home-card:hover { border-color: var(--panel-3); }
      .home-card:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
      .home-card.current { border-color: var(--accent); }
      .home-thumb { aspect-ratio: 16 / 10; background: var(--panel-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .home-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
      .home-thumb-empty .ic, .home-folder-ic .ic { width: 32px; height: 32px; color: var(--muted); }
      .home-meta { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .home-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .home-sub { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .home-empty { color: var(--muted); padding: 40px 20px; }
      .home-note { color: var(--muted); padding: 12px 20px 0; }

      /* Version history (over the right panel) */
      .history { position: absolute; inset: 0; z-index: 20; background: var(--panel); display: flex; flex-direction: column; }
      .history[hidden] { display: none; }
      .history-head { height: 48px; display: flex; align-items: center; gap: 2px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); flex: none; }
      .history-title { flex: 1; font-weight: 600; }
      .history-list { flex: 1; overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
      .history-day { color: var(--muted); font-size: 11px; padding: 10px 8px 4px; }
      .history-item { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 8px 32px 8px 10px; border: none; border-radius: 6px; background: none; text-align: left; cursor: pointer; outline: none; }
      .history-item:hover { background: var(--panel-2); }
      .history-item:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
      .history-item.on { background: var(--accent-soft); }
      .history-item.named .history-name, .history-item.current .history-name { font-weight: 600; }
      .history-desc { color: var(--text-2); }
      .history-sub { color: var(--muted); font-size: 11px; }
      .history-more { position: absolute; right: 4px; top: 6px; opacity: 0; }
      .history-item:hover .history-more, .history-item.on .history-more, .history-more:focus-visible { opacity: 1; }
      /* Comments: pins on the canvas, the thread window, the right-hand panel */
      #comments { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
      #comments > * { pointer-events: auto; position: absolute; left: 0; top: 0; }
      #stage.tool-comment #canvas { cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2724%27%20height%3D%2724%27%3E%3Cpath%20d%3D%27M12%2022.5L8.6%2017.4A8%208%200%201%201%2015.4%2017.4Z%27%20fill%3D%27white%27%20stroke%3D%27black%27%2F%3E%3Cpath%20d%3D%27M12%206v8M8%2010h8%27%20stroke%3D%27black%27%20stroke-width%3D%271.5%27%2F%3E%3C%2Fsvg%3E") 12 22, crosshair; }
      .cpin { width: 28px; height: 28px; padding: 0; border: 2px solid #fff; border-radius: 50%; background: var(--c, var(--accent)); color: #fff; font: 600 12px/24px Inter, system-ui, sans-serif; text-align: center; cursor: pointer; box-shadow: 0 2px 6px #0007; touch-action: none; }
      /* Our own comment pin: a circle with a tail at the bottom center (the tip is the comment point). */
      .cpin::after { content: ''; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 5px solid transparent; border-top: 6px solid #fff; border-bottom: 0; }
      .cpin:hover, .cpin.on { box-shadow: 0 0 0 2px var(--accent), 0 2px 8px #0009; }
      .cpin:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .cpin.resolved { background: #8a8a8a; }
      .cpin.drag { cursor: grabbing; opacity: .85; }
      .cpin.draft { pointer-events: none; }
      .cthread { width: 296px; max-height: calc(100% - 80px); display: flex; flex-direction: column; background: var(--panel); border-radius: 10px; box-shadow: 0 8px 28px #000a, 0 0 0 1px #0008; color: var(--text); }
      .cthread.flash { animation: cflash .6s; }
      @keyframes cflash { 30% { box-shadow: 0 0 0 3px var(--accent), 0 8px 28px #000a; } }
      .cdraft { padding: 10px; gap: 8px; }
      .cthread-head { display: flex; align-items: center; gap: 2px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); flex: none; }
      .cthread-title { flex: 1; font-weight: 600; }
      .cthread-head .icon-btn.on { color: var(--dev); }
      .cthread-list { overflow: auto; padding: 2px 0; min-height: 0; }
      .ccomment { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
      .ccomment + .ccomment { border-top: 1px solid var(--line); }
      .ccomment-head { display: flex; align-items: center; gap: 8px; min-height: 24px; }
      .cavatar { width: 22px; height: 22px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 10px; }
      .ccomment-name, .citem-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ccomment-time { color: var(--muted); white-space: nowrap; flex: 1; }
      .ccomment-more { opacity: 0; }
      .ccomment:hover .ccomment-more, .ccomment-more:focus-visible, .ccomment-more.open { opacity: 1; }
      .ccomment-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 18px; }
      .cfield { width: 100%; resize: none; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); padding: 6px 8px; font: 12px/18px Inter, system-ui, sans-serif; outline: none; }
      .cfield:focus { border-color: var(--accent); }
      .creply { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; border-top: 1px solid var(--line); flex: none; }
      .creply .cbtn { align-self: flex-end; }
      .cacts { display: flex; justify-content: flex-end; gap: 6px; }
      .cbtn { height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--text); cursor: pointer; }
      .cbtn:hover { background: var(--panel-2); }
      .cbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .cbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      .cbtn.primary:hover { background: var(--accent-2); }
      .cbtn.primary:disabled { opacity: .45; cursor: default; }
      .cbtn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
      .cconfirm { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex: none; }
      /* Server comments: mentions, attachments, reactions */
      .ccomposer { position: relative; display: flex; flex-direction: column; gap: 6px; }
      .ccomposer-tools { display: flex; align-items: center; gap: 6px; }
      .ccomposer-hint { color: var(--muted); font-size: 11px; }
      .catt-chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .catt-chips:empty { display: none; }
      .catt-chip { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; height: 22px; padding: 0 2px 0 8px; border-radius: 11px; background: var(--panel-2); color: var(--text-2); font-size: 11px; }
      .catt-chip > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .catt-chip.loading { opacity: .6; padding-right: 8px; }
      .cmention-pop { position: absolute; left: 0; right: 0; bottom: calc(100% + 4px); z-index: 3; background: var(--menu); border-radius: 8px; box-shadow: 0 0 0 1px #00000080, 0 8px 24px #000000b3; padding: 4px; display: flex; flex-direction: column; max-height: 220px; overflow: auto; }
      .cmention-item { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: none; border-radius: 5px; background: none; color: var(--text); text-align: left; cursor: pointer; flex: none; }
      .cmention-item.on { background: var(--accent); color: #fff; }
      .cmention-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cmention-mail { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cmention-item.on .cmention-mail { color: #ffffffcc; }
      .cmention { color: var(--accent); font-weight: 600; }
      .creacts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
      .creact { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 11px; border: 1px solid var(--border); background: none; color: var(--text); cursor: pointer; font-size: 12px; }
      .creact:hover:not(:disabled) { background: var(--panel-2); }
      .creact.on { border-color: var(--accent); background: var(--accent-soft); }
      .creact:disabled { cursor: default; }
      .creact-n { font-size: 11px; color: var(--text-2); }
      .creact-add { opacity: 0; }
      .ccomment:hover .creact-add, .creact-add:focus-visible, .creact-add.open { opacity: 1; }
      .cemoji-pop { display: grid !important; grid-template-columns: repeat(5, 32px); gap: 2px; padding: 6px; }
      .cemoji { width: 32px; height: 32px; border: none; border-radius: 6px; background: none; font-size: 18px; cursor: pointer; }
      .cemoji:hover { background: var(--panel-2); }
      .catts { display: flex; flex-wrap: wrap; gap: 6px; }
      .catt-img { padding: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); overflow: hidden; cursor: zoom-in; max-width: 100%; min-width: 40px; min-height: 30px; }
      .catt-img img { display: block; max-width: 240px; max-height: 160px; }
      .catt-file { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text); cursor: pointer; }
      .catt-file:hover { background: var(--panel-2); }
      .catt-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .catt-size { color: var(--muted); font-size: 11px; white-space: nowrap; }
      /* Notifications */
      .bell-btn { position: relative; }
      .bell-btn .bell-n { position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--danger); color: #fff; font-size: 9px; line-height: 14px; font-weight: 600; text-align: center; pointer-events: none; }
      .bell-btn .bell-n:empty { display: none; }
      .notes-pop { padding: 6px; }
      .notes-list { display: flex; flex-direction: column; gap: 2px; overflow: auto; max-height: 420px; }
      .note { position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px 8px 8px; border: none; border-radius: 6px; background: none; color: var(--text); text-align: left; cursor: pointer; flex: none; }

      /* Side panel headers */

      .side-head.file-head { height: auto; min-height: 48px; flex-direction: column; align-items: stretch; justify-content: center; gap: 0; padding: 8px 8px 8px 6px; }

      /* Collapsed interface: a chip with the file name and an “expand” button. */
      .ui-restore { position: fixed; left: 12px; top: calc(var(--tabs-h, 0px) + 12px); z-index: 60; display: none; align-items: center; gap: 4px; height: 40px; padding: 0 4px 0 8px; border-radius: 10px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 4px 16px #0006; }

      .ui-restore button { width: 28px; height: 28px; padding: 0; border: none; border-radius: 6px; background: none; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .ui-restore button:hover { background: var(--panel-2); color: var(--text); }
      /* The “Pages” and “Layers” headers collapse (arrow on the left). */
      .sec-toggle { display: inline-flex; align-items: center; gap: 0; margin-left: -10px; padding: 0 4px 0 0; border: none; background: none; color: inherit; font: inherit; cursor: pointer; }
      .sec-toggle::before { content: ''; flex: none; width: 4px; height: 4px; margin: 0 4px 0 2px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translate(-1px, -1px); opacity: 0; transition: opacity 0.1s; }
      #left .section:hover .sec-toggle::before, .sec-toggle:focus-visible::before, .sec-toggle[aria-expanded='false']::before { opacity: 1; }
      .sec-toggle[aria-expanded='false']::before { transform: rotate(-45deg) translate(-1px, -1px); }
      #left .section h3 .sec-toggle { width: auto; height: 28px; justify-content: flex-start; color: inherit; background: none; border-radius: 0; font-size: inherit; }
      #pages-section.collapsed #pages, #layers-section.collapsed #layers { display: none; }
      .pages-search { padding: 0 8px 6px 12px; }
      .pages-search input { width: 100%; height: 26px; padding: 0 8px; border: 1px solid transparent; border-radius: 5px; background: var(--panel-2); color: var(--text); outline: none; font: inherit; }
      .pages-search input:focus { border-color: var(--accent); }
      #layers-section.collapsed { flex: none; }
      .file-chevron .ic { width: 14px; height: 14px; }
      .file-where { padding: 0 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .file-where:empty { display: none; }
      #right .side-head.right { justify-content: flex-end; gap: 6px; flex-wrap: wrap; height: auto; min-height: 48px; padding-block: 8px; }
      #right .side-head.right > button { flex-shrink: 0; }
      #presence { display: flex; flex: 1 1 86px; min-width: 0; align-items: center; flex-wrap: wrap; gap: 6px 0; padding-left: 4px; }
      #presence .avatar { width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 2px solid var(--panel); margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 12px; cursor: pointer; position: relative; flex: none; }
      #presence .avatar:hover { z-index: 1; transform: translateY(-1px); }
      #presence .avatar.following { box-shadow: 0 0 0 2px var(--c); z-index: 2; }
      #presence .avatar.spot::after { content: ''; position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--warning); border: 1.5px solid var(--panel); }
      .follow-frame { position: absolute; inset: 0; border: 2px solid var(--c); pointer-events: none; z-index: 7; }
      .follow-frame[hidden] { display: none; }
      .follow-label { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: var(--c); color: #fff; font-weight: 600; padding: 2px 10px 3px; border-radius: 0 0 6px 6px; white-space: nowrap; }
      .chat-box { position: absolute; left: 0; top: 0; z-index: 8; }
      .chat-input { width: 220px; height: 30px; border: none; border-radius: 4px 15px 15px 15px; background: var(--c); color: #fff; padding: 0 12px; font: 12px Inter, system-ui, sans-serif; outline: none; box-shadow: 0 2px 10px #0007; }
      .chat-input::placeholder { color: #ffffffb3; }
      .peer-cursor span.chat { white-space: normal; width: max-content; max-width: 240px; font-size: 12px; line-height: 16px; padding: 5px 10px; border-radius: 4px 14px 14px 14px; overflow-wrap: anywhere; }
      #presence .avatar:first-child, #presence .voice-btn + .avatar { margin-left: 0; }

      #presence .voice-btn.on { color: var(--dev); }
      #presence .voice-btn.muted { color: var(--danger); }
      #presence .voice-btn.leave { color: var(--danger); }
      #presence .avatar.voice::before { content: ''; position: absolute; left: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--dev); border: 1.5px solid var(--panel); }
      #presence .avatar.voice.muted::before { background: var(--danger); }

      .present-more { width: 16px; height: 28px; margin: 0 4px 0 -8px; padding: 0; border: none; border-radius: 6px; background: none; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

      .me-btn { display: flex; align-items: center; gap: 2px; height: 32px; padding: 0 4px 0 2px; border: none; border-radius: 16px; background: none; color: var(--text-2); cursor: pointer; flex-shrink: 0; }
      .me-btn:hover, .me-btn.open { background: var(--panel-2); }
      .me-btn[hidden] { display: none; }
      #right #presence:empty { flex: 1 1 0; min-width: 0; padding: 0; }
      .me-btn .me-av { width: 26px; height: 26px; border-radius: 50%; background: var(--c, var(--accent)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; }
      .me-btn .ic { width: 12px; height: 12px; }
      .present-btn { width: 28px; height: 28px; border: none; border-radius: 6px; background: none; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: 4px; }
      .present-btn:hover { background: var(--panel-2); }
      .present-btn .ic { width: 16px; height: 16px; fill: currentColor; }
      .share-btn { height: 28px; padding: 0 12px; border: none; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
      .share-btn:hover { background: var(--accent-2); }
      .share-btn.live { background: var(--dev); }
      .share-btn .ic { width: 16px; height: 16px; }
      .tabs { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); }
      .tabs .tab-group { display: flex; gap: 2px; }

      .tabs .tab.on { color: var(--text); background: var(--panel-2); }
      .set-row { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); align-items: center; gap: 8px; min-height: 24px; }
      .set-label { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .set-row > .prow { gap: 4px; }

      .set-row .seg button .ic { width: 16px; height: 16px; }
      .proto-row { display: flex; align-items: center; gap: 4px; min-height: 32px; min-width: 0; }
      .proto-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 4px 8px; border: 1px solid transparent; border-radius: 5px; background: var(--panel-2); color: var(--text); cursor: pointer; text-align: left; }
      .proto-row-main:hover, .proto-row-main.open { border-color: var(--panel-3); }
      .proto-trigger { font-weight: 600; }
      .proto-action { color: var(--text-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .proto-pop { overflow: auto; }
      /* Interaction window: the trigger as a header, lists without a backdrop, “type + direction” and “curve + duration” rows. */
      .proto-head { display: flex; align-items: center; gap: 2px; padding: 6px 6px 6px 4px; border-bottom: 1px solid var(--line); }

      /* Left panel: pages and layers */

      .section h3 button { width: 24px; height: 24px; border: none; border-radius: 5px; background: none; color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; font-size: 14px; }

      .row { display: flex; align-items: center; gap: 4px; padding: 0 6px 0 0; height: 32px; cursor: default; white-space: nowrap; border-radius: 0; color: var(--text-2); }

      .text-stats { margin-left: 6px; font-weight: 400; color: var(--muted); font-size: 11px; white-space: nowrap; }

      /* Paint window (paint-editor.ts) and color picker (color-picker.ts) */
      .paint-editor { position: fixed; z-index: 40; width: 248px; background: var(--panel); border-radius: 10px; box-shadow: 0 0 0 1px #00000080, 0 10px 32px #000000b3; color: var(--text); user-select: none; outline: none; }

      .pe-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; }

      .file-opening-card { display: flex; flex-direction: column; gap: 14px; width: min(360px, calc(100vw - 40px)); padding: 24px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }

      .pe-stop-rows { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow: auto; }

      .pe-btn { height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 5px; background: none; cursor: pointer; white-space: nowrap; flex: none; }

      /* Gradient: square stops above the bar, a list of stops “position | color | −”. */

      .pe-stop-del .ic { width: 16px; height: 16px; }
      .pe-stop-del:hover { background: var(--panel-2); color: var(--text); }

      .pe-check { display: flex; gap: 6px; align-items: center; color: var(--text-2); }
      .shader-code { width: min(720px, calc(100vw - 32px)); }
      .sh-code { width: 100%; height: min(420px, 55vh); resize: vertical; font: 12px/1.5 ui-monospace, 'Cascadia Code', Consolas, monospace; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; tab-size: 2; white-space: pre; }
      .sh-status { margin-top: 6px; color: var(--muted); font: 12px ui-monospace, monospace; white-space: pre-wrap; }

      .pe-slider { display: grid; grid-template-columns: 84px 1fr 28px; align-items: center; gap: 6px; color: var(--text-2); }
      .pe-slider input { width: 100%; accent-color: var(--accent); margin: 0; }

      .cp { display: flex; flex-direction: column; gap: 10px; }

      .lib-update-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lib-update-sub { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .lib-update-sub.new { color: var(--accent); }
      .m-row { display: flex; gap: 8px; align-items: center; }
      /* A widget's Input field on the canvas. */
      .widget-input { position: fixed; z-index: 50; margin: 0; padding: 0 2px; border: none; outline: 2px solid var(--accent); border-radius: 2px; background: #fff; color: #000; resize: none; overflow: hidden; line-height: 1.25; }
      /* Plugin from a description. */
      .gen-modal { width: min(680px, calc(100vw - 32px)); }
      .gen-ask { width: 100%; resize: vertical; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font: inherit; }
      .gen-status { margin: 6px 0; color: var(--text-2); }
      .gen-status.err { color: var(--danger, #e5484d); }
      .gen-code { width: 100%; height: min(320px, 45vh); resize: vertical; font: 12px/1.5 ui-monospace, 'Cascadia Code', Consolas, monospace; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; white-space: pre; tab-size: 2; }
      .gen-result { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
      .gen-result[hidden] { display: none; }
      /* Custom keyboard shortcuts. */
      .keys-modal { width: min(620px, calc(100vw - 32px)); }
      .keys-list { max-height: min(460px, 60vh); overflow: auto; margin-top: 8px; display: flex; flex-direction: column; }
      .keys-row { display: grid; grid-template-columns: 1fr auto 150px; gap: 8px; align-items: center; min-height: 32px; padding: 0 4px; border-radius: 6px; }
      .keys-row:hover { background: var(--panel-2); }
      .keys-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .keys-path { color: var(--muted); margin-left: 8px; font-size: 11px; }
      .keys-builtin { color: var(--muted); font: 11px ui-monospace, monospace; }
      .keys-btn { height: 26px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text-2); cursor: pointer; font: 12px ui-monospace, monospace; }
      .keys-btn.set { color: var(--text); border-color: var(--accent); }
      .keys-btn.wait { background: var(--accent); color: #fff; border-color: var(--accent); }
      /* Vectorize: the image and the vector side by side. */
      .vz-modal { width: min(620px, calc(100vw - 32px)); }
      .vz-panes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .vz-panes figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .vz-panes figcaption { color: var(--muted); font-size: 11px; }
      .vz-img, .vz-svg { width: 100%; height: 220px; object-fit: contain; border-radius: 6px; background: repeating-conic-gradient(#8883 0 25%, #0000 0 50%) 0 0 / 12px 12px; }
      .vz-svg svg { width: 100%; height: 100%; display: block; }
      .vz-val { width: 28px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
      .m-row input[type='range'] { flex: 1; accent-color: var(--accent); }
      .m-row.end { justify-content: flex-end; }
      .m-input, .m-select { height: 32px; background: var(--panel-2); border: 1px solid transparent; border-radius: 6px; padding: 0 10px; outline: none; color: var(--text); min-width: 0; }
      .m-row > .m-input { flex: 1; }
      .modal [hidden] { display: none !important; }
      .m-select { padding: 0 6px; }
      .m-input:focus, .m-select:focus { border-color: var(--accent); }
      .m-input.code { font: 600 20px/1 ui-monospace, monospace; letter-spacing: 0.35em; text-align: center; height: 44px; }
      .m-btn { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border); background: none; cursor: pointer; white-space: nowrap; flex: none; }
      .m-btn:hover { background: var(--panel-2); }
      .m-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      .m-btn.primary:hover { background: var(--accent-2); }
      .m-btn.danger { color: #ff8a73; }
      .m-btn:disabled { opacity: 0.5; cursor: default; background: none; }
      .m-btn.primary:disabled { background: var(--accent); }
      .m-link { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
      .m-link:disabled { color: var(--muted); cursor: default; }
      .m-note { color: var(--muted); margin: 0; }
      .m-note.warn { color: #e0a33c; }
      .m-error { color: #ff8a73; margin: 0; }
      .m-error:empty { display: none; }
      .m-label { color: var(--text-2); font-weight: 600; margin-top: 4px; }
      .m-sep { border: none; border-top: 1px solid var(--line); margin: 2px 0; }
      .m-list { display: flex; flex-direction: column; gap: 2px; }
      .catalog-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #ffffff10; }
      .catalog-text { flex: 1; min-width: 0; }
      .catalog-name { font-weight: 600; }
      .catalog-desc { color: var(--text); opacity: 0.85; font-size: 12px; margin-top: 2px; }
      .catalog-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
      .catalog-meta a { color: var(--muted); }
      .person { display: flex; align-items: center; gap: 10px; min-height: 40px; }
      .person .avatar, .acct-btn .avatar, .m-dest .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; flex: none; }
      .person .avatar.invite { background: var(--panel-3) !important; color: var(--text-2); }
      .person-text { flex: 1; min-width: 0; }
      .person-name, .person-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .person-sub { color: var(--muted); font-size: 11px; }
      .person-role { color: var(--text-2); white-space: nowrap; }
      .m-token { font: 12px/1.5 ui-monospace, monospace; background: var(--panel-2); border-radius: 6px; padding: 8px 10px; word-break: break-all; user-select: all; }
      .m-dest { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 0 10px; border: none; border-radius: 6px; background: none; text-align: left; cursor: pointer; }
      .m-dest:hover { background: var(--panel-2); }
      .m-dest.on { background: var(--accent-soft); }
      .m-dest .sub { color: var(--muted); margin-left: auto; font-size: 11px; }
      .m-dest.indent { padding-left: 28px; }
      /* “Files”: account and server */
      .home-group { color: var(--muted); font-size: 11px; font-weight: 600; padding: 14px 10px 4px; display: flex; align-items: center; gap: 4px; }
      .home-group .icon-btn { margin-left: auto; width: 22px; height: 22px; }
      .home-group .icon-btn .ic { width: 14px; height: 14px; }
      .home-side .acct-btn { margin-top: auto; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 8px; border: none; border-radius: 6px; background: none; color: var(--text); cursor: pointer; text-align: left; flex: none; }
      .home-side .acct-btn:hover { background: var(--panel-2); }
      .acct-btn .avatar { width: 24px; height: 24px; font-size: 11px; }
      .acct-btn .acct-text { min-width: 0; display: flex; flex-direction: column; }
      .acct-btn .acct-sub { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .branch-btn { flex: none; height: 22px; padding: 0 6px; margin-left: 2px; border: none; border-radius: 4px; background: none; color: var(--text-2); cursor: pointer; font-size: 12px; white-space: nowrap; }
      .branch-btn:hover { background: var(--panel-2); color: var(--text); }
      .branch-btn.on { color: #c9a8ff; background: #9747ff22; }
      .branch-ic { width: 28px; height: 28px; border-radius: 50%; background: #9747ff33; color: #c9a8ff; display: flex; align-items: center; justify-content: center; flex: none; font-size: 14px; }
      .branch-here { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 8px; background: #9747ff14; }
      .merge-screen { cursor: pointer !important; }
      .merge-screen.on { background: var(--accent-soft); }
      .merge-conflicts-head { margin-top: 10px; color: #ffa629; }
      .merge-conflict { display: flex; flex-direction: column; gap: 3px; padding: 6px 8px; border-left: 3px solid #ffa629; border-radius: 4px; }
      .merge-choices { display: flex; gap: 12px; margin-top: 2px; }
      .merge-choice { display: flex; align-items: center; gap: 4px; cursor: pointer; }
      .merge-other { padding: 6px 8px; }
      .home-badge { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; background: var(--panel-3); color: var(--text-2); font-size: 10px; line-height: 16px; font-weight: 500; vertical-align: 1px; }
      .file-name .home-badge { margin-left: 8px; }
      #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 18px; background: color-mix(in srgb, var(--accent) 13%, transparent); border: 2px dashed var(--accent); z-index: 30; pointer-events: none; }
      body.dragover #drop { display: flex; }
    </style>
    <script>
      // High contrast — before the first paint (the user's choice or the system setting).
      try {
        const v = localStorage.getItem('mfp-contrast');
        if (v === 'more' || (!v && matchMedia('(prefers-contrast: more)').matches)) document.documentElement.setAttribute('data-contrast', '');
      } catch {}
      // The look (new by default) and the theme of the new look: dark, light or as in the system.
      try {
        const saved = localStorage.getItem('mfp-ui');
        const ui = saved === 'classic' || saved === 'new' ? saved : document.querySelector('meta[name="mfp-ui-default"]')?.content === 'classic' ? 'classic' : 'new';
        const t = localStorage.getItem('mfp-theme');
        document.documentElement.dataset.ui = ui;
        if (ui === 'new' && (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches))) document.documentElement.dataset.theme = 'light';
      } catch {
        document.documentElement.dataset.ui = document.querySelector('meta[name="mfp-ui-default"]')?.content === 'classic' ? 'classic' : 'new';
      }
    </script>
  </head>
  <body>
    <div id="app">
      <aside id="left" aria-label="Страницы и слои">
        <nav class="rail" id="rail" aria-label="Разделы">
          <button class="logo-btn" id="menu-btn" title="Главное меню"></button>
        </nav>
        <div class="side-head file-head">
          <div class="file-row">
            <button class="file-name" id="file-title" title="Файл: переименовать, история версий (двойной щелчок — переименовать)"><span id="filename">Без названия</span></button>
            <button class="file-min" id="ui-min-btn" title="Свернуть интерфейс (Ctrl+Shift+\)" aria-label="Свернуть интерфейс"></button>
          </div>
          <div class="file-where" id="file-where"></div>
        </div>
        <div class="section" id="pages-section">
          <h3><button class="sec-toggle" id="pages-toggle" aria-expanded="true" title="Свернуть или развернуть страницы">Страницы</button> <span class="h-acts"><button id="page-search" title="Поиск страниц"></button><button id="add-page" title="Новая страница"></button></span></h3>
          <div id="pages" role="listbox" aria-label="Страницы"></div>
        </div>
        <div class="section" id="layers-section">
          <h3><button class="sec-toggle" id="layers-toggle" aria-expanded="true" title="Свернуть или развернуть слои">Слои</button> <span class="h-acts"><button id="collapse-layers" title="Свернуть все слои (Alt+L)"></button></span></h3>
          <div id="layers" role="tree" aria-label="Слои" aria-multiselectable="true"></div>
        </div>
      </aside>
      <main id="stage" aria-label="Холст">
        <canvas id="canvas" tabindex="0" role="application" aria-roledescription="холст" aria-label="Холст" aria-describedby="canvas-help"></canvas>
        <div id="canvas-help" class="sr-only">Tab и Shift+Tab — соседний слой, Enter — внутрь, Shift+Enter — к родителю, стрелки — сдвинуть выделенное, без выделения — прокрутить холст. Плюс и минус — масштаб. Escape — снять выделение. F6 — следующая панель.</div>
        <div id="labels"></div>
        <div id="status"></div>
        <nav id="toolbar" role="toolbar" aria-label="Инструменты"></nav>
        <button class="help-btn" id="shortcuts-btn" title="Справка и сочетания клавиш"></button>
      </main>
      <aside id="right" aria-label="Свойства">
        <div class="side-head right">
          <div id="presence"></div>
          <button class="present-btn" id="present-btn" title="Показ прототипа (Ctrl+Alt+Enter)"></button>
          <button class="share-btn" id="collab-btn" title="Совместная работа: комната на сервере (npm run dev:server)">Поделиться</button>
        </div>
        <div class="tabs">
          <div class="tab-group" role="tablist" aria-label="Панель свойств"><button class="tab on" id="tab-design" role="tab" aria-selected="true" aria-controls="properties" title="Свойства слоёв">Дизайн</button><button class="tab" id="tab-prototype" role="tab" aria-selected="false" aria-controls="properties" title="Взаимодействия и показ (Shift+E)">Прототип</button></div>
          <span class="dev-label">Инспект</span>
          <button class="zoom-btn" id="zoom" title="Масштаб">100%</button>
        </div>
        <div id="properties" role="tabpanel"></div>
      </aside>
    </div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
    <div id="drop">Отпустите файл .mfp, .fig, .sketch или .pdf, чтобы открыть</div>
    <input id="open-input" type="file" accept=".mfp,.fig,.sketch,.pdf,.json" hidden />
    <input id="plugin-input" type="file" multiple hidden />
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>

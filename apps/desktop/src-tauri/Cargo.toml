[package]
name = "mfp-desktop"
version = "0.3.1"
description = "MFP — interface design editor (desktop)"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[lib]
name = "mfp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"
fontdb = "0.24.0"
ttf-parser = "0.25.1"
trash = "5.2.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# The office server exits together with the app (Job Object); already among Tauri dependencies.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"

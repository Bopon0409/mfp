<style>
  body { font: 12px system-ui, sans-serif; margin: 12px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  label { display: block; margin-bottom: 8px; }
  input, select { width: 60px; }
  button { margin-right: 6px; }
</style>
<label>Count: <input id="count" type="number" value="5" min="1" max="50" /></label>
<label>Shape:
  <select id="shape"><option value="rect">square</option><option value="ellipse">circle</option></select>
</label>
<button id="create">Create</button>
<button id="cancel">Cancel</button>
<script>
  document.getElementById('create').onclick = () => {
    const count = parseInt(document.getElementById('count').value, 10);
    const shape = document.getElementById('shape').value;
    parent.postMessage({ pluginMessage: { type: 'create-shapes', count, shape } }, '*');
  };
  document.getElementById('cancel').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
  };
</script>
